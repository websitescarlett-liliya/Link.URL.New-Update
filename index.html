<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload V/F To URL</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <video id="bg-video" autoplay loop muted playsinline style="display: none;"></video>

    <div class="app-container">
        <header id="main-header">
            <div class="search-title">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Website Scarlet Upload V/F To URL</span>
            </div>

            <div class="user-bar">
                <button class="access-btn"><i class="fa-solid fa-key"></i> Website Akses Khusus</button>
                <div class="profile-section">
                    <img src="https://ui-avatars.com/api/?name=User&background=0D8ABC&color=fff" id="profile-img" alt="Profile">
                    <input type="text" id="username-input" value="UserScarlet" title="Klik untuk ubah username">
                    <button id="settings-toggle-btn" class="icon-btn"><i class="fa-solid fa-gear"></i></button>
                </div>
            </div>
        </header>

        <main>
            <div class="tab-navigation">
                <button id="tab-photo" class="tab-btn expand-effect active">
                    <i class="fa-solid fa-image"></i> Geser Kiri: Upload Foto
                </button>
                <button id="tab-video" class="tab-btn expand-effect">
                    <i class="fa-solid fa-video"></i> Geser Kanan: Upload Video
                </button>
            </div>

            <section id="section-photo" class="upload-card active">
                <h2><i class="fa-solid fa-camera"></i> Upload Foto ke URL</h2>
                <p>Pilih atau drag & drop foto Anda di bawah ini</p>
                <input type="file" id="input-photo" accept="image/*" hidden>
                <div class="drop-zone" id="drop-photo">
                    <img id="preview-photo" class="preview-img" style="display:none;">
                    <i class="fa-solid fa-cloud-arrow-up" id="icon-photo"></i>
                    <p id="text-photo">Klik atau Seret Foto ke Sini</p>
                </div>
                <button id="btn-upload-photo" class="action-btn expand-effect">Upload Foto</button>
                <div id="result-photo" class="result-box"></div>
            </section>

            <section id="section-video" class="upload-card">
                <h2><i class="fa-solid fa-film"></i> Upload Video ke URL</h2>
                <p>Pilih atau drag & drop video Anda di bawah ini</p>
                <input type="file" id="input-video" accept="video/*" hidden>
                <div class="drop-zone" id="drop-video">
                    <video id="preview-video" class="preview-video" controls style="display:none;"></video>
                    <i class="fa-solid fa-file-video" id="icon-video"></i>
                    <p id="text-video">Klik atau Seret Video ke Sini</p>
                </div>
                <button id="btn-upload-video" class="action-btn expand-effect">Upload Video</button>
                <div id="result-video" class="result-box"></div>
            </section>
        </main>

        <aside id="settings-sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3><i class="fa-solid fa-sliders"></i> Pengaturan Website</h3>
                <button id="close-settings" class="icon-btn">&times;</button>
            </div>
            <div class="sidebar-content">
                <div class="setting-item">
                    <label><i class="fa-solid fa-moon"></i> Mode Tampilan</label>
                    <button id="toggle-theme" class="expand-effect">Ganti Mode (Dark/Light)</button>
                </div>

                <div class="setting-item">
                    <label><i class="fa-solid fa-headset"></i> Laporkan Error/Bug</label>
                    <a href="https://wa.me/6288801883795?text=Halo%20Admin,%20saya%20menemukan%20error/bug%20di%20website%20Upload%20VF%20To%20URL" target="_blank" class="admin-btn expand-effect">
                        <i class="fa-brands fa-whatsapp"></i> Chat Admin
                    </a>
                </div>

                <div class="setting-item">
                    <label><i class="fa-brands fa-google"></i> Cari di Google</label>
                    <form action="https://www.google.com/search" method="get" target="_blank" class="search-form">
                        <input type="text" name="q" placeholder="Ketik kata kunci...">
                        <button type="submit" class="expand-effect"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </form>
                </div>

                <div class="setting-item">
                    <label><i class="fa-solid fa-link"></i> Pintasan Platform Populer</label>
                    <div class="shortcut-buttons">
                        <a href="https://x.com" target="_blank" class="shortcut-btn expand-effect"><i class="fa-brands fa-x-twitter"></i> X</a>
                        <a href="https://www.tiktok.com" target="_blank" class="shortcut-btn expand-effect"><i class="fa-brands fa-tiktok"></i> TikTok</a>
                        <a href="https://www.instagram.com" target="_blank" class="shortcut-btn expand-effect"><i class="fa-brands fa-instagram"></i> IG</a>
                        <a href="https://www.youtube.com" target="_blank" class="shortcut-btn expand-effect"><i class="fa-brands fa-youtube"></i> YT</a>
                        <a href="https://www.facebook.com" target="_blank" class="shortcut-btn expand-effect"><i class="fa-brands fa-facebook"></i> FB</a>
                        <a href="https://web.telegram.org" target="_blank" class="shortcut-btn expand-effect"><i class="fa-brands fa-telegram"></i> Tele</a>
                    </div>
                </div>

                <div class="setting-item">
                    <label><i class="fa-solid fa-palette"></i> Ganti Warna Header</label>
                    <input type="color" id="header-color-picker" value="#ffffff">
                </div>

                <div class="setting-item">
                    <label><i class="fa-solid fa-image"></i> Custom Background (Galeri)</label>
                    <input type="file" id="bg-file-input" accept="image/*,video/*">
                    <button id="reset-bg" class="expand-effect danger-btn">Reset Background</button>
                </div>
            </div>
        </aside>
        <div id="overlay" class="overlay"></div>
    </div>

    <script src="script.js"></script>
</body>
    </html>
