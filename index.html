<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload V/F To URL Scarlet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: all 0.3s;}
        :root {--bg-color: #ffffff; --text-color: #000; --card-bg: #f5f5f5; --border-color: #000; --accent-color: #000; --btn-text: #ffffff;}
        body.dark-mode {--bg-color: #121212; --text-color: #ffffff; --card-bg: #1e1e1e; --border-color: #ffffff; --accent-color: #ffffff; --btn-text: #000;}
        body {background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; background-size: cover; background-position: center; background-attachment: fixed;}
        #bg-video {position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -1; object-fit: cover;}
      .app-container {max-width: 900px; margin: 0 auto; padding: 20px;}
      .expand-effect {transition: transform 0.2s; cursor: pointer;}.expand-effect:hover { transform: scale(1.06); }.expand-effect:active { transform: scale(0.95); }
        header {background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 12px; padding: 15px 20px; margin-bottom: 25px;}
      .search-title {display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: bold; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-bottom: 12px;}
      .user-bar {display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
      .access-btn {background-color: var(--accent-color); color: var(--btn-text); border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold;}
      .profile-section {display: flex; align-items: center; gap: 10px;}
      .profile-section img {width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--border-color);}
        #username-input {background: transparent; border: 1px solid var(--border-color); color: var(--text-color); padding: 5px 10px; border-radius: 5px; font-weight: bold; width: 130px;}
      .icon-btn {background: none; border: none; font-size: 1.3rem; color: var(--text-color); cursor: pointer;}
      .tab-navigation {display: flex; gap: 15px; margin-bottom: 20px;}
      .tab-btn {flex: 1; padding: 12px; border: 2px solid var(--border-color); background: var(--card-bg); color: var(--text-color); font-weight: bold; border-radius: 8px;}
      .tab-btn.active {background: var(--accent-color); color: var(--btn-text);}
      .upload-card {display: none; background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 12px; padding: 30px; text-align: center;}
      .upload-card.active {display: block; animation: fadeIn 0.4s ease;} @keyframes fadeIn {from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); }}
      .drop-zone {border: 2px dashed var(--border-color); border-radius: 8px; padding: 20px; margin: 20px 0; cursor: pointer;}.drop-zone.dragover { background: rgba(0,0,0,0.08); }
      .drop-zone i { font-size: 3rem; margin-bottom: 10px; }
      .preview-img,.preview-video {max-width: 100%; max-height: 250px; border-radius: 8px; margin-bottom: 10px;}
      .action-btn {background: var(--accent-color); color: var(--btn-text); border: none; padding: 12px 30px; font-size: 1rem; font-weight: bold; border-radius: 6px; width: 100%;}
      .action-btn:disabled { opacity: 0.6; cursor: not-allowed; }
      .result-box {margin-top: 20px; word-break: break-all;}.result-box input {width: 70%; padding: 8px; margin-right: 5px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-color); color: var(--text-color);}
      .sidebar {position: fixed; top: 0; right: -350px; width: 320px; height: 100%; background: var(--card-bg); border-left: 2px solid var(--border-color); z-index: 1000; transition: right 0.3s ease; padding: 20px; overflow-y: auto;}
      .sidebar.open { right: 0; }.sidebar-header {display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px;}
      .setting-item {margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px;}.setting-item label { font-size: 0.9rem; font-weight: bold; }
      .setting-item button,.admin-btn,.shortcut-btn {padding: 10px; border: 1px solid var(--border-color); background: var(--accent-color); color: var(--btn-text); border-radius: 6px; text-align: center; text-decoration: none; font-weight: bold; display: block;}
      .admin-btn { background-color: #25D366; color: white; border: none; }
      .shortcut-buttons {display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;}
      .shortcut-btn {font-size: 0.8rem; padding: 10px 5px; display: flex; flex-direction: column; align-items: center; gap: 4px;}
      .shortcut-btn i { font-size: 1.2rem; }
      .search-form { display: flex; gap: 5px; }.search-form input {flex: 1; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;}
      .danger-btn { background: #ff4d4d!important; color: white!important; border: none!important; }
      .overlay {display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 999;}.overlay.active { display: block; }
        @media (max-width: 600px) {.tab-navigation { flex-direction: column; }.result-box input { width: 100%; margin-bottom: 8px; }}
    </style>
</head>
<body>
    <video id="bg-video" autoplay loop muted playsinline style="display: none;"></video>
    <div class="app-container">
        <header id="main-header">
            <div class="search-title"><i class="fa-solid fa-magnifying-glass"></i><span>Website Scarlet Upload V/F To URL</span></div>
            <div class="user-bar">
                <button class="access-btn"><i class="fa-solid fa-key"></i> Website Akses Khusus</button>
                <div class="profile-section">
                    <img src="https://ui-avatars.com/api/?name=User&background=0D8ABC&color=fff" id="profile-img" alt="Profile">
                    <input type="text" id="username-input" value="UserScarlet">
                    <button id="settings-toggle-btn" class="icon-btn"><i class="fa-solid fa-gear"></i></button>
                </div>
            </div>
        </header>
        <main>
            <div class="tab-navigation">
                <button id="tab-photo" class="tab-btn expand-effect active"><i class="fa-solid fa-image"></i> Upload Foto</button>
                <button id="tab-video" class="tab-btn expand-effect"><i class="fa-solid fa-video"></i> Upload Video</button>
            </div>
            <section id="section-photo" class="upload-card active">
                <h2><i class="fa-solid fa-camera"></i> Upload Foto ke URL</h2><p>Pilih atau drag & drop foto Anda</p>
                <input type="file" id="input-photo" accept="image/*" hidden>
                <div class="drop-zone" id="drop-photo"><img id="preview-photo" class="preview-img" style="display:none;"><i class="fa-solid fa-cloud-arrow-up" id="icon-photo"></i><p id="text-photo">Klik atau Seret Foto ke Sini</p></div>
                <button id="btn-upload-photo" class="action-btn expand-effect">Upload Foto</button>
                <div id="result-photo" class="result-box"></div>
            </section>
            <section id="section-video" class="upload-card">
                <h2><i class="fa-solid fa-film"></i> Upload Video ke URL</h2><p>Pilih atau drag & drop video Anda</p>
                <input type="file" id="input-video" accept="video/*" hidden>
                <div class="drop-zone" id="drop-video"><video id="preview-video" class="preview-video" controls style="display:none;"></video><i class="fa-solid fa-file-video" id="icon-video"></i><p id="text-video">Klik atau Seret Video ke Sini</p></div>
                <button id="btn-upload-video" class="action-btn expand-effect">Upload Video</button>
                <div id="result-video" class="result-box"></div>
            </section>
        </main>
        <aside id="settings-sidebar" class="sidebar">
            <div class="sidebar-header"><h3><i class="fa-solid fa-sliders"></i> Pengaturan Website</h3><button id="close-settings" class="icon-btn">&times;</button></div>
            <div class="sidebar-content">
                <div class="setting-item"><label><i class="fa-solid fa-moon"></i> Mode Tampilan</label><button id="toggle-theme" class="expand-effect">Ganti Mode (Dark/Light)</button></div>
                <div class="setting-item"><label><i class="fa-solid fa-headset"></i> Laporkan Error/Bug</label><a href="https://wa.me/6288801883795?text=Halo%20Admin,%20saya%20menemukan%20error/bug%20di%20website%20Upload%20VF%20To%20URL" target="_blank" class="admin-btn expand-effect"><i class="fa-brands fa-whatsapp"></i> Chat Admin</a></div>
                <div class="setting-item"><label><i class="fa-brands fa-google"></i> Cari di Google</label><form action="https://www.google.com/search" method="get" target="_blank" class="search-form"><input type="text" name="q" placeholder="Ketik kata kunci..."><button type="submit" class="expand-effect"><i class="fa-solid fa-magnifying-glass"></i></button></form></div>
                <div class="setting-item">
                    <label><i class="fa-solid fa-link"></i> Pintasan Platform - Buka di App</label>
                    <div class="shortcut-buttons">
                        <a href="#" data-app="twitter://user?screen_name=" data-web="https://x.com" class="shortcut-btn expand-effect open-app"><i class="fa-brands fa-x-twitter"></i> X</a>
                        <a href="#" data-app="snssdk1233://" data-web="https://www.tiktok.com" class="shortcut-btn expand-effect open-app"><i class="fa-brands fa-tiktok"></i> TikTok</a>
                        <a href="#" data-app="instagram://" data-web="https://www.instagram.com" class="shortcut-btn expand-effect open-app"><i class="fa-brands fa-instagram"></i> IG</a>
                        <a href="#" data-app="vnd.youtube://" data-web="https://www.youtube.com" class="shortcut-btn expand-effect open-app"><i class="fa-brands fa-youtube"></i> YT</a>
                        <a href="#" data-app="fb://" data-web="https://www.facebook.com" class="shortcut-btn expand-effect open-app"><i class="fa-brands fa-facebook"></i> FB</a>
                        <a href="#" data-app="tg://" data-web="https://web.telegram.org" class="shortcut-btn expand-effect open-app"><i class="fa-brands fa-telegram"></i> Tele</a>
                    </div>
                </div>
                <div class="setting-item"><label><i class="fa-solid fa-palette"></i> Ganti Warna Header</label><input type="color" id="header-color-picker" value="#ffffff"></div>
                <div class="setting-item"><label><i class="fa-solid fa-image"></i> Custom Background</label><input type="file" id="bg-file-input" accept="image/*,video/*"><button id="reset-bg" class="expand-effect danger-btn">Reset Background</button></div>
            </div>
        </aside>
        <div id="overlay" class="overlay"></div>
    </div>
    <script src="script.js"></script>
</body>
                                                                          </html>
